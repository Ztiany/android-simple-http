plugins {
    id "com.android.library"
    id "kotlin-android"
    id 'maven-publish'
}

android {
    namespace "com.android.sdk.net"

    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

}

dependencies {
    implementation "androidx.annotation:annotation:1.8.2"

    //must
    api "com.squareup.retrofit2:retrofit:2.11.0"
    api "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.jakewharton.timber:timber:4.7.1"

    //optional
    api "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"

    //optional
    compileOnly "io.reactivex.rxjava2:rxjava:2.2.21"
    compileOnly "com.squareup.retrofit2:adapter-rxjava2:2.9.0"
    compileOnly "com.github.dmstocking:support-optional:1.2"

    testImplementation "io.reactivex.rxjava2:rxjava:2.2.21"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    testImplementation "com.squareup.retrofit2:adapter-rxjava2:2.9.0"
    testImplementation "com.github.dmstocking:support-optional:1.2"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.release
                groupId = 'io.github.ztiany'
                artifactId = 'android-simple-http'
                version = '1.2.3'
            }
        }
    }
}