plugins {
    id "com.android.library"
    id "kotlin-android"
    id 'maven-publish'
}

android {
    namespace "com.android.sdk.net"

    compileSdk rootProject.properties["app.compileSdk"] as int

    defaultConfig {
        minSdk rootProject.properties["app.minSdk"] as int
        targetSdk rootProject.properties["app.targetSdk"] as int
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

tasks.register('javadoc', Javadoc) {
    options.encoding = "utf-8"
}

dependencies {
    implementation "androidx.annotation:annotation:1.8.2"
    api "com.squareup.retrofit2:retrofit:2.11.0"
    api "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.jakewharton.timber:timber:4.7.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
}

group = 'io.github.ztiany'
version = '1.0'

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.release
                groupId = 'io.github.ztiany'
                artifactId = 'android-simple-http'
                version = rootProject.properties["app.publishVersion"] as String
            }
        }
    }
}