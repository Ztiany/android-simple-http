import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id "com.android.library"
    id "kotlin-android"
    id "com.vanniktech.maven.publish" version "0.30.0"
}

android {
    namespace "com.android.sdk.net"

    compileSdk rootProject.properties["app.compileSdk"] as int

    defaultConfig {
        minSdk rootProject.properties["app.minSdk"] as int
        targetSdk rootProject.properties["app.targetSdk"] as int
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

tasks.register('javadoc', Javadoc) {
    options.encoding = "utf-8"
}

dependencies {
    implementation "androidx.annotation:annotation:1.8.2"
    api "com.squareup.retrofit2:retrofit:2.11.0"
    api "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "com.jakewharton.timber:timber:4.7.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
}

mavenPublishing {
    // configuring maven central
    // or when publishing to https://central.sonatype.com/
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()

    // configuring the pom
    def libVersion = rootProject.properties["app.publishVersion"] as String
    coordinates("io.github.ztiany", "android-simple-http", libVersion)

    pom {
        name = "android-simple-http"
        description = "An android library makes http requesting easy."
        inceptionYear = "2020"
        url = "https://github.com/username/mylibrary/"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "ztiany"
                name = "Alien"
                url = "https://github.com/Ztiany/"
            }
        }
        scm {
            url = "https://github.com/Ztiany/android-simple-http/"
            connection = "scm:git:git://github.com/Ztiany/android-simple-http.git"
            developerConnection = "scm:git:ssh://git@github.com/Ztiany/android-simple-http.git"
        }
    }
}